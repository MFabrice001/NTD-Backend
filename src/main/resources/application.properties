jwt.expiration=86400000

# CORS Configuration
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,https://ntd-frontend-gamma.vercel.app}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS

